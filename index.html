const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const fmtDate = (iso) => parseISO(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
const uid = () => 'c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

function relativeDue(iso) {
  const d = diffDays(todayISO(), iso);
  if (d < 0) return `en retard (${-d} j)`;
  if (d === 0) return "aujourd'hui";
  if (d === 1) return 'demain';
  return `dans ${d} j`;
}

function normalize(s) {
  let t = String(s || '').toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/[“”«»"]/g, ' ');
  t = t.replace(/\bcan't\b/g, 'cannot').replace(/\bcan not\b/g, 'cannot')
    .replace(/\bwon't\b/g, 'will not').replace(/\bshan't\b/g, 'shall not')
    .replace(/n't\b/g, ' not').replace(/'ve\b/g, ' have').replace(/'re\b/g, ' are')
    .replace(/'ll\b/g, ' will').replace(/'d\b/g, ' would').replace(/\bi'm\b/g, 'i am')
    .replace(/\b(it|that|what|there|he|she|here|who|where|how)'s\b/g, '$1 is')
    .replace(/\borganized\b/g, 'organised').replace(/\brealize\b/g, 'realise');
  t = t.replace(/[.,!?;:()[\]…–—]/g, ' ').replace(/\s+/g, ' ').trim();
  return t;
}

function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

const GAP_RE = /_{2,}/;
const hasGap = (p) => GAP_RE.test(p || '');
const fillGap = (prompt, ans) => prompt.replace(GAP_RE, ans).replace(/\s*\([^)]*\)/g, '');
const acceptedAnswers = (card) => [card.answer, ...(card.alternatives || [])].filter(Boolean);

function evaluate(input, card) {
  const u = normalize(input);
  const targets = acceptedAnswers(card).map(normalize).filter(Boolean);
  if (targets.includes(u)) return { correct: true, near: false };
  if (hasGap(card.prompt)) {
    const fulls = acceptedAnswers(card).map((a) => normalize(fillGap(card.prompt, a)));
    if (fulls.includes(u)) return { correct: true, near: false };
  }
  const best = Math.min(...targets.map((t) => levenshtein(u, t)));
  const len = Math.max(...targets.map((t) => t.length), 1);
  return { correct: false, near: len >= 6 && best <= Math.max(1, Math.round(len * 0.12)) };
}

function similarity(input, card) {
  const u = normalize(input);
  if (!u) return 0;
  const scores = acceptedAnswers(card).map(normalize).map((t) => 1 - levenshtein(u, t) / Math.max(u.length, t.length, 1));
  return Math.round(Math.max(...scores) * 100);
}

function audioTextFor(card) {
  if (hasGap(card.prompt)) return fillGap(card.prompt, card.answer);
  return card.answer;
}

const MODULE_ALIASES = { pieges: 'pieges', 'pièges': 'pieges', piege: 'pieges', traps: 'pieges', trap: 'pieges',
  collocations: 'collocations', collocation: 'collocations', colloc: 'collocations', flashcards: 'collocations', flashcard: 'collocations',
  c1: 'c1', oral: 'c1', drill: 'c1', syntax: 'c1', syntaxe: 'c1' };

function makeCard(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const module = MODULE_ALIASES[String(raw.module || '').toLowerCase().trim()] || 'pieges';
  const prompt = String(raw.prompt || raw.question || raw.fr || '').trim();
  const answer = String(raw.answer || raw.en || '').trim();
  if (!prompt || !answer) return null;
  let alternatives = raw.alternatives || raw.alts || [];
  if (typeof alternatives === 'string') alternatives = alternatives.split('|');
  alternatives = (Array.isArray(alternatives) ? alternatives : []).map((s) => String(s).trim()).filter(Boolean);
  const type = raw.type === 'oral' || raw.type === 'input' ? raw.type : MODULES[module].type;
  return {
    id: raw.id ? String(raw.id) : uid(),
    module, type,
    category: String(raw.category || '').trim(),
    prompt, answer, alternatives,
    hint: String(raw.hint || '').trim(),
    explanation: String(raw.explanation || raw.rule || '').trim(),
    tip: String(raw.tip || raw.mnemonic || '').trim(),
    example: String(raw.example || '').trim(),
    level: clamp(parseInt(raw.level, 10) || 1, 1, 5),
    nextReviewDate: /^\d{4}-\d{2}-\d{2}$/.test(raw.nextReviewDate || '') ? raw.nextReviewDate : todayISO(),
    reviews: parseInt(raw.reviews, 10) || 0,
    lapses: parseInt(raw.lapses, 10) || 0,
    correctCount: parseInt(raw.correctCount, 10) || 0,
    lastReviewed: raw.lastReviewed || null,
    createdAt: raw.createdAt || todayISO(),
  };
}

function applySRS(card, correct) {
  const today = todayISO();
  if (correct) {
    const level = Math.min(5, card.level + 1);
    return { ...card, level, nextReviewDate: addDays(today, INTERVALS[level]), reviews: card.reviews + 1, correctCount: card.correctCount + 1, lastReviewed: today };
  }
  return { ...card, level: 1, nextReviewDate: addDays(today, INTERVALS[1]), reviews: card.reviews + 1, lapses: card.lapses + 1, lastReviewed: today };
}

function srsPreview(card, correct) {
  if (correct) {
    const l = Math.min(5, card.level + 1);
    return card.level === 5 ? `Niveau 5 maintenu · prochaine révision dans ${INTERVALS[5]} jours` : `Niveau ${card.level} → ${l} · prochaine révision dans ${INTERVALS[l]} jours`;
  }
  return 'Retour au niveau 1 · à revoir demain, et une fois encore en fin de session';
}

/* ---------- Stockage ---------- */
const DEFAULT_STATS = { xp: 0, streak: 0, bestStreak: 0, lastStudyDate: null, history: {},
  settings: { accent: 'en-GB', rate: 0.95, sessionLimit: 40, dailyGoal: 20, autoplay: true } };

function loadCards() {
  try {
    const raw = localStorage.getItem(STORAGE_CARDS);
    if (raw === null) return SEED.map(makeCard);
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.map(makeCard).filter(Boolean) : SEED.map(makeCard);
  } catch (e) { return SEED.map(makeCard); }
}
function loadStats() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_STATS) || 'null');
    if (!s) return DEFAULT_STATS;
    return { ...DEFAULT_STATS, ...s, settings: { ...DEFAULT_STATS.settings, ...(s.settings || {}) }, history: s.history || {} };
  } catch (e) { return DEFAULT_STATS; }
}

function recordStats(stats, correct, firstAttempt) {
  const today = todayISO();
  const h = { ...(stats.history[today] || { reviewed: 0, correct: 0 }) };
  h.reviewed += 1; if (correct) h.correct += 1;
  let { streak, bestStreak, lastStudyDate } = stats;
  if (lastStudyDate !== today) {
    streak = lastStudyDate === addDays(today, -1) ? streak + 1 : 1;
    lastStudyDate = today;
  }
  const xpGain = correct ? (firstAttempt ? 10 : 3) : 1;
  return { ...stats, xp: stats.xp + xpGain, streak, bestStreak: Math.max(bestStreak, streak), lastStudyDate, history: { ...stats.history, [today]: h } };
}

/* ---------- Voix ---------- */
function pickVoice(accent) {
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const norm = (l) => (l || '').replace('_', '-').toLowerCase();
  const cand = voices.filter((v) => norm(v.lang).startsWith(accent.toLowerCase()));
  return cand.find((v) => /natural|neural|premium|enhanced|google|siri|daniel|serena|samantha|libby|sonia|aria|jenny/i.test(v.name))
    || cand[0] || voices.find((v) => norm(v.lang).startsWith('en'));
}
function speak(text, settings, onEnd) {
  if (!('speechSynthesis' in window)) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = settings.accent; u.rate = settings.rate;
  const v = pickVoice(settings.accent); if (v) u.voice = v;
  u.onend = onEnd; u.onerror = onEnd;
  speechSynthesis.speak(u);
  return true;
}

function useDictation(lang) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const [listening, setListening] = useState(false);
  const [transcript, setTranscript] = useState('');
  const recRef = useRef(null);
  const start = () => {
    if (!SR) return;
    try { recRef.current && recRef.current.abort(); } catch (e) {}
    const rec = new SR();
    rec.lang = lang; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onresult = (e) => { let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; setTranscript(t); };
    rec.onend = () => setListening(false);
    rec.onerror = () => setListening(false);
    recRef.current = rec; setTranscript(''); setListening(true);
    try { rec.start(); } catch (e) { setListening(false); }
  };
  const stop = () => { try { recRef.current && recRef.current.stop(); } catch (e) {} };
  useEffect(() => () => { try { recRef.current && recRef.current.abort(); } catch (e) {} }, []);
  return { supported: !!SR, listening, transcript, setTranscript, start, stop };
}

function Icon({ name, size = 20, className = '', strokeWidth = 2 }) {
  const ref = useRef(null);
  const key = Array.isArray(name) ? name.join('|') : name;
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const L = window.lucide;
    const names = key.split('|');
    let node = null;
    if (L) for (const n of names) { node = (L.icons && L.icons[n]) || L[n]; if (node && Array.isArray(node)) break; node = null; }
    if (!node) { el.innerHTML = ''; return; }
    let children = node;
    if (typeof node[0] === 'string') children = node[2] || [];
    const attrs = (a) => Object.entries(a || {}).map(([k, v]) => `${k}="${String(v).replace(/"/g, '&quot;')}"`).join(' ');
    const inner = children.map((c) => `<${c[0]} ${attrs(c[1])}></${c[0]}>`).join('');
    el.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  }, [key, size, strokeWidth]);
  return <span ref={ref} className={'inline-flex items-center justify-center shrink-0 ' + className} style={{ width: size, height: size }} aria-hidden="true" />;
}

function Button({ children, variant = 'primary', className = '', size = 'md', ...props }) {

    indigo: 'bg-indigo-500 hover:bg-indigo-600 text-white btn-3d',

    soft: 'bg-slate-100 hover:bg-slate-200 text-slate-700',
    link: 'text-slate-500 hover:text-slate-800 underline-offset-2 hover:underline',
  };
  const sizes = { sm: 'px-3 py-1.5 text-sm rounded-lg', md: 'px-4 py-2.5 text-sm rounded-xl', lg: 'px-6 py-3.5 text-base rounded-2xl' };
  return (
    <button {...props} className={`inline-flex items-center justify-center gap-2 font-semibold transition disabled:opacity-40 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}>
      {children}
    </button>
  );
}

  if (!hasGap(card.prompt)) return <span>{card.prompt}</span>;
  const [before, ...rest] = card.prompt.split(GAP_RE);
  const after = rest.join('___');
  return (
    <span>
      {before}
      {revealed
        ? <span className="px-1.5 mx-0.5 rounded-md bg-emerald-100 text-emerald-700 font-bold">{card.answer}</span>
        : <span className="inline-block align-middle w-16 mx-1 border-b-[3px] border-dashed border-slate-300" />}
      {after}
    </span>
  );
}

    e && e.preventDefault();

              {card.alternatives.map((a, i) => (
                <div key={i} className="flex items-center gap-2 text-sm text-slate-700"><SpeakButton text={a} settings={settings} compact /> {a}</div>
              ))}
            </div>
          )}
          {score !== null && (
            <div className="mt-4 p-3 rounded-2xl bg-white border border-amber-100">
              <div className="text-xs text-slate-500 mb-1">Ta version : <span className="italic text-slate-700">« {typed} »</span></div>
              <div className="flex items-center gap-3">
                <div className="flex-1 h-2.5 rounded-full bg-slate-100 overflow-hidden">
                  <div className={`h-full rounded-full ${score >= 90 ? 'bg-emerald-500' : score >= 70 ? 'bg-yellow-400' : 'bg-rose-400'}`} style={{ width: score + '%' }} />
                </div>
                <span className="text-sm font-bold text-slate-700">{score} %</span>
              </div>
            </div>
          )}
          <RuleBox card={card} />
          <div className="mt-5 text-sm font-semibold text-slate-700 text-center">Ta formulation était-elle correcte ?</div>
          <div className="mt-3 grid grid-cols-2 gap-3">
            <Button variant="danger" size="lg" onClick={() => onDone(false)}><Icon name={['RotateCcw']} size={18} /> À revoir</Button>
            <Button autoFocus variant="primary" size="lg" onClick={() => onDone(true)}><Icon name={['Check']} size={18} /> Je l’avais !</Button>
          </div>
          {srsActive && <div className="mt-3 text-xs text-slate-500 text-center">Juste : {srsPreview(card, true)}</div>}
        </div>
      )}
    </div>
  );
}

/* =========================================================
   SESSION
   ========================================================= */
function Session({ session, cards, settings, onAnswer, onExit, onMore }) {
  const [queue, setQueue] = useState(() => session.ids.map((id) => ({ id, attempt: 1, key: id + '-1' })));
  const [pos, setPos] = useState(0);
  const [res, setRes] = useState({ correct: 0, wrong: 0, xp: 0 });
  const [done, setDone] = useState(false);
  const item = queue[pos];
  const card = item && cards.find((c) => c.id === item.id);
  const firstCount = session.ids.length;

  const handleDone = (correct) => {
    const first = item.attempt === 1;
    const srsActive = session.updateSRS && first;
    onAnswer(card.id, correct, { updateSRS: srsActive, firstAttempt: first });
    setRes((r) => ({ correct: r.correct + (correct && first ? 1 : 0), wrong: r.wrong + (!correct && first ? 1 : 0), xp: r.xp + (correct ? (first ? 10 : 3) : 1) }));
    let q = queue;
    if (!correct && item.attempt < 3) {
      q = [...queue, { id: item.id, attempt: item.attempt + 1, key: item.id + '-' + (item.attempt + 1) }];
      setQueue(q);
    }
    if (pos + 1 >= q.length) setDone(true); else setPos(pos + 1);
  };

  if (done || !card) {
    const total = res.correct + res.wrong;
    const pct = total ? Math.round((res.correct / total) * 100) : 0;
    return (
      <div className="max-w-xl mx-auto px-4 py-10 text-center anim-pop">
        <div className="mx-auto h-24 w-24 rounded-full bg-gradient-to-br from-yellow-300 to-amber-500 flex items-center justify-center text-white shadow-lg mb-6">
          <Icon name={['Trophy']} size={48} />
        </div>
        <h2 className="text-3xl font-extrabold text-slate-900">Session terminée !</h2>
        <p className="text-slate-500 mt-2">{pct >= 80 ? 'Superbe régularité. Tu te rapproches du C1.' : pct >= 50 ? 'Bon travail : les erreurs d’aujourd’hui sont les acquis de demain.' : 'Les cartes ratées reviendront demain. C’est exactement comme ça qu’on progresse.'}</p>
        <div className="grid grid-cols-3 gap-3 mt-8">
          <div className="rounded-2xl bg-white border border-slate-200 p-4"><div className="text-2xl font-extrabold text-emerald-600">{res.correct}</div><div className="text-xs text-slate-500 font-medium">du 1er coup</div></div>
          <div className="rounded-2xl bg-white border border-slate-200 p-4"><div className="text-2xl font-extrabold text-rose-500">{res.wrong}</div><div className="text-xs text-slate-500 font-medium">à retravailler</div></div>
          <div className="rounded-2xl bg-white border border-slate-200 p-4"><div className="text-2xl font-extrabold text-amber-500">+{res.xp}</div><div className="text-xs text-slate-500 font-medium">XP</div></div>
        </div>
        <div className="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
          <Button size="lg" variant="ghost" onClick={onExit}><Icon name={['House', 'Home']} size={18} /> Accueil</Button>
          <Button size="lg" onClick={onMore}><Icon name={['Dumbbell']} size={18} /> Encore 10 cartes</Button>
        </div>
      </div>
    );
  }

  const progress = Math.min(100, (Math.min(pos, firstCount) / firstCount) * 100);
  const srsActive = session.updateSRS && item.attempt === 1;
  return (
    <div className="max-w-2xl mx-auto px-4 py-6">
      <div className="flex items-center gap-3 mb-6">
        <button onClick={() => { if (pos === 0 || confirm('Quitter la session ? Tes réponses déjà données sont enregistrées.')) onExit(); }} className="p-2 rounded-xl hover:bg-slate-200 text-slate-500"><Icon name={['X']} size={22} /></button>
        <div className="flex-1 h-4 rounded-full bg-slate-200 overflow-hidden">
          <div className="h-full rounded-full bg-gradient-to-r from-emerald-400 to-emerald-500 transition-all duration-500" style={{ width: progress + '%' }} />
        </div>
        <span className="text-sm font-bold text-slate-500 tabular-nums">{Math.min(pos + 1, queue.length)}/{queue.length}</span>
      </div>

      <div key={item.key} className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8 anim-fade">
        <div className="flex items-center justify-between gap-2 mb-5 flex-wrap">
          <div className="flex items-center gap-2 flex-wrap">
            <ModuleBadge module={card.module} />
            {card.category && <span className="text-xs font-medium text-slate-500">{card.category}</span>}
          </div>
          <div className="flex items-center gap-2">
            {item.attempt > 1 && <span className="text-xs font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full">2e chance</span>}
            {!session.updateSRS && <span className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">Libre</span>}
            <LevelDots card={card} />
          </div>
        </div>
        {card.type === 'oral'
          ? <OralExercise card={card} settings={settings} srsActive={srsActive} onDone={handleDone} />
          : <InputExercise card={card} settings={settings} srsActive={srsActive} onDone={handleDone} />}
      </div>
      <p className="text-center text-xs text-slate-400 mt-4">Astuce : <kbd className="px-1.5 py-0.5 bg-white border rounded">Entrée</kbd> pour valider puis continuer.</p>
    </div>
  );
}

          })}

      </div>

      {/* LEITNER + ACTIVITÉ */}
      <div className="grid md:grid-cols-2 gap-4">
        <div className="rounded-3xl bg-white border border-slate-200 p-5">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-extrabold text-slate-900">Boîtes de Leitner</h3>
            <span className="text-xs font-semibold text-sky-600 bg-sky-50 px-2 py-0.5 rounded-full">{newCount} nouvelles</span>
          </div>
          <div className="grid grid-cols-5 gap-2 items-end h-32">
            {boxes.map((n, i) => {
              const max = Math.max(1, ...boxes);
              return (
                <div key={i} className="flex flex-col items-center justify-end h-full">
                  <span className="text-xs font-bold text-slate-600 mb-1 tabular-nums">{n}</span>
                  <div className={`w-full rounded-t-xl ${LEVEL_COLORS[i + 1]}`} style={{ height: Math.max(6, (n / max) * 90) + '%' }} />

              const h = stats.history[d]; const n = h ? h.reviewed : 0;

                <div key={d} className="flex-1 flex flex-col justify-end h-full group relative" title={`${fmtDate(d)} : ${n} révisions${h ? `, ${h.correct} justes` : ''}`}>

        </div>
        <Button variant="dark" onClick={onImport}><Icon name={['Upload']} size={16} /> Importer du JSON</Button>
      </div>
    </div>
  );
}

/* =========================================================
   ENTRAÎNEMENT LIBRE (MODALE)
   ========================================================= */
function PracticeModal({ initialModule, cards, onClose, onStart }) {
  const [module, setModule] = useState(initialModule || 'all');
  const [count, setCount] = useState(10);
  const [order, setOrder] = useState('weak');
  const [updateSRS, setUpdateSRS] = useState(false);
  const pool = cards.filter((c) => module === 'all' || c.module === module);
  const opt = (active) => `px-3 py-2 rounded-xl text-sm font-semibold border-2 transition ${active ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-slate-200 text-slate-600 hover:border-slate-300'}`;
  return (
    <Modal title="Entraînement libre" onClose={onClose}>
      <div className="space-y-5">
        <div>
          <div className="text-sm font-bold text-slate-700 mb-2">Module</div>
          <div className="flex flex-wrap gap-2">
            <button className={opt(module === 'all')} onClick={() => setModule('all')}>Tous</button>
            {Object.entries(MODULES).map(([k, m]) => <button key={k} className={opt(module === k)} onClick={() => setModule(k)}>{m.short}</button>)}
          </div>
        </div>
        <div>
          <div className="text-sm font-bold text-slate-700 mb-2">Nombre de cartes</div>
          <div className="flex flex-wrap gap-2">
            {[10, 20, 30, 0].map((n) => <button key={n} className={opt(count === n)} onClick={() => setCount(n)}>{n || `Toutes (${pool.length})`}</button>)}
          </div>
        </div>
        <div>
          <div className="text-sm font-bold text-slate-700 mb-2">Ordre</div>
          <div className="flex flex-wrap gap-2">
            <button className={opt(order === 'weak')} onClick={() => setOrder('weak')}>Points faibles d’abord</button>
            <button className={opt(order === 'random')} onClick={() => setOrder('random')}>Aléatoire</button>
            <button className={opt(order === 'new')} onClick={() => setOrder('new')}>Nouvelles d’abord</button>
          </div>
        </div>
        <label className="flex items-start gap-3 p-3 rounded-2xl bg-slate-50 cursor-pointer">
          <input type="checkbox" checked={updateSRS} onChange={(e) => setUpdateSRS(e.target.checked)} className="mt-1 h-4 w-4 accent-emerald-500" />
          <span className="text-sm text-slate-600"><span className="font-semibold text-slate-800">Mettre à jour la répétition espacée.</span> Par défaut, l’entraînement libre ne modifie pas tes niveaux ni tes dates de révision.</span>
        </label>
        <Button size="lg" className="w-full" disabled={!pool.length} onClick={() => {
          let list = [...pool];
          if (order === 'random') list = shuffle(list);
          else if (order === 'weak') list = shuffle(list).sort((a, b) => (a.reviews ? a.level : 0.5) - (b.reviews ? b.level : 0.5) || b.lapses - a.lapses);
          else list = shuffle(list).sort((a, b) => a.reviews - b.reviews);
          if (count) list = list.slice(0, count);
          if (order !== 'random') list = shuffle(list.slice(0, Math.max(list.length, 1)));
          onStart(list.map((c) => c.id), updateSRS);
        }}>
          <Icon name={['Play']} size={18} /> C’est parti ({count ? Math.min(count, pool.length) : pool.length})
        </Button>
      </div>
    </Modal>
  );
}

              <div className="text-right shrink-0 space-y-1">

            </button>
            {open === c.id && (
              <div className="px-4 pb-4 border-t border-slate-100 pt-3 anim-fade">
                {(c.alternatives || []).length > 0 && <div className="text-xs text-slate-500 mb-2"><span className="font-semibold">Aussi accepté :</span> {c.alternatives.join(' · ')}</div>}
                {c.hint && <div className="text-xs text-slate-500 mb-2"><span className="font-semibold">Indice :</span> {c.hint}</div>}
                <RuleBox card={c} />
                <div className="mt-3 text-xs text-slate-400">{c.reviews} révision(s) · {c.lapses} erreur(s) · ajoutée le {fmtDate(c.createdAt)}</div>
                <div className="flex flex-wrap gap-2 mt-3">
                  <SpeakButton text={audioTextFor(c)} settings={settings} />
                  <Button size="sm" variant="ghost" onClick={() => onReset(c.id)}><Icon name={['RotateCcw']} size={14} /> Remettre au niveau 1</Button>
                  <Button size="sm" variant="ghost" className="!text-rose-600" onClick={() => { if (confirm('Supprimer cette carte ?')) onDelete(c.id); }}><Icon name={['Trash2']} size={14} /> Supprimer</Button>
                </div>
              </div>
            )}
          </div>
        ))}
        {!list.length && <div className="text-center py-16 text-slate-400">Aucune carte ne correspond.</div>}
      </div>
    </div>
  );
}

/* =========================================================
   DONNÉES : AJOUT, IMPORT, EXPORT, RÉGLAGES
   ========================================================= */
const JSON_EXAMPLE = `[
  {
    "module": "pieges",
    "category": "Since / For",
    "prompt": "She has worked here ___ 2019.",
    "answer": "since",
    "hint": "depuis + point de départ",
    "explanation": "SINCE + point de départ ; FOR + durée.",
    "tip": "SINCE = Starting point."
  },
  {
    "module": "collocations",
    "category": "Verbe + nom",
    "prompt": "tenir une promesse",
    "answer": "keep a promise",
    "alternatives": ["keep one's promise"],
    "explanation": "On KEEP une promesse, on BREAK une promesse.",
    "example": "He always keeps his promises."
  },
  {
    "module": "c1",
    "category": "Inversion négative",
    "prompt": "Commence par « Rarely » : « I have rarely heard such a convincing argument. »",
    "answer": "Rarely have I heard such a convincing argument.",
    "explanation": "Adverbe négatif en tête → inversion auxiliaire + sujet."
  }
]`;

const AI_PROMPT = `Génère 50 exercices d'anglais pour un francophone qui passe du niveau B2 au C1, sous forme d'un tableau JSON valide (et rien d'autre).
Chaque objet contient :
- "module" : "pieges" (erreurs typiques des francophones : temps, prépositions, faux amis, modaux… ; phrase anglaise avec ___ à compléter, ou phrase française à traduire), "collocations" (expression française → collocation anglaise naturelle) ou "c1" (consigne de reformulation orale en français + phrase source anglaise ; structures C1 : inversions, clivées, conditionnels mixtes, nominalisation, hedging…)
- "category" : thème court
- "prompt" : la question
- "answer" : la réponse de référence
- "alternatives" : tableau d'autres réponses correctes (facultatif)
- "hint" : indice court en français (facultatif)
- "explanation" : la règle en français, concise
- "tip" : un moyen mnémotechnique (facultatif)
- "example" : une phrase d'exemple en anglais (facultatif, utile pour les collocations)
Répartis : 20 pieges, 15 collocations, 15 c1. Varie les thèmes et évite les doublons avec : since/for, through/though, depend on, explain to me, should have.`;

function AddCardForm({ onAdd }) {
  const empty = { module: 'pieges', category: '', prompt: '', answer: '', alternatives: '', hint: '', explanation: '', tip: '', example: '' };
  const [f, setF] = useState(empty);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const input = 'w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-400 bg-white text-sm';
  const placeholders = {
    pieges: ['I have known her ___ ten years.', 'for'],
    collocations: ['faire une erreur', 'make a mistake'],
    c1: ['Commence par « Seldom » : « We seldom see such talent. »', 'Seldom do we see such talent.'],
  }[f.module];
  return (
    <form onSubmit={(e) => {
      e.preventDefault();
      const card = makeCard({ ...f, alternatives: f.alternatives.split('|') });
      if (!card) return;
      onAdd(card); setF({ ...empty, module: f.module, category: f.category });
    }} className="space-y-3">
      <div className="grid grid-cols-2 gap-3">
        <select value={f.module} onChange={set('module')} className={input}>
          {Object.entries(MODULES).map(([k, m]) => <option key={k} value={k}>{m.label}</option>)}
        </select>
        <input value={f.category} onChange={set('category')} placeholder="Catégorie (ex : Since / For)" className={input} />
      </div>
      <input value={f.prompt} onChange={set('prompt')} required placeholder={`Question — ex : ${placeholders[0]}  (___ pour un trou)`} className={input} />
      <input value={f.answer} onChange={set('answer')} required placeholder={`Réponse — ex : ${placeholders[1]}`} className={input} />
      <input value={f.alternatives} onChange={set('alternatives')} placeholder="Autres réponses acceptées, séparées par |" className={input} />
      <div className="grid sm:grid-cols-2 gap-3">
        <input value={f.hint} onChange={set('hint')} placeholder="Indice (facultatif)" className={input} />
        <input value={f.example} onChange={set('example')} placeholder="Exemple en anglais (facultatif)" className={input} />
      </div>
      <textarea value={f.explanation} onChange={set('explanation')} rows={2} placeholder="Explication de la règle" className={input + ' resize-none'} />
      <input value={f.tip} onChange={set('tip')} placeholder="Moyen mnémotechnique (facultatif)" className={input} />
      <Button type="submit" className="w-full"><Icon name={['Plus']} size={16} /> Ajouter la carte</Button>
    </form>
  );
}

function ImportModal({ cards, onClose, onMerge, onRestore, notify }) {
  const [text, setText] = useState('');
  const [error, setError] = useState('');
  const fileRef = useRef(null);
  let parsed = null;
  try { parsed = text.trim() ? JSON.parse(text) : null; } catch (e) { parsed = undefined; }
  const isBackup = parsed && !Array.isArray(parsed) && Array.isArray(parsed.cards);
  const rawList = Array.isArray(parsed) ? parsed : isBackup ? parsed.cards : parsed && Array.isArray(parsed.exercises) ? parsed.exercises : null;

  const merge = () => {
    setError('');
    if (parsed === undefined) return setError('JSON invalide : vérifie les virgules, guillemets et crochets.');
    if (!rawList) return setError('Format attendu : un tableau [ {...}, {...} ] ou un objet { "cards": [...] }.');
    const existingIds = new Set(cards.map((c) => c.id));
    const existingKeys = new Set(cards.map((c) => normalize(c.prompt) + '|' + normalize(c.answer)));
    let added = [], dup = 0, invalid = 0;
    rawList.forEach((r) => {
      const c = makeCard(r);
      if (!c) { invalid++; return; }
      const k = normalize(c.prompt) + '|' + normalize(c.answer);
      if (existingIds.has(c.id) || existingKeys.has(k)) { dup++; return; }
      existingIds.add(c.id); existingKeys.add(k); added.push(c);
    });
    onMerge(added);
    notify(`${added.length} carte(s) ajoutée(s)${dup ? ` · ${dup} doublon(s) ignoré(s)` : ''}${invalid ? ` · ${invalid} invalide(s)` : ''}`, added.length ? 'success' : 'info');
    if (added.length) onClose();
  };

  return (
    <Modal title="Importer des exercices (JSON)" onClose={onClose} wide>
      <div className="space-y-4">
        <p className="text-sm text-slate-600">Colle un tableau JSON d’exercices, ou charge un fichier. Les champs obligatoires sont <code className="bg-slate-100 px-1 rounded">module</code>, <code className="bg-slate-100 px-1 rounded">prompt</code> et <code className="bg-slate-100 px-1 rounded">answer</code>. Les nouvelles cartes sont dues dès aujourd’hui.</p>
        <div className="flex flex-wrap gap-2">
          <Button size="sm" variant="soft" onClick={() => setText(JSON_EXAMPLE)}><Icon name={['FileJson', 'FileCode']} size={14} /> Insérer un exemple</Button>
          <Button size="sm" variant="soft" onClick={() => { navigator.clipboard && navigator.clipboard.writeText(AI_PROMPT).then(() => notify('Prompt copié : colle-le dans ton IA préférée.', 'info')); }}><Icon name={['Sparkles']} size={14} /> Copier un prompt pour IA</Button>
          <Button size="sm" variant="soft" onClick={() => fileRef.current && fileRef.current.click()}><Icon name={['FolderOpen']} size={14} /> Charger un fichier</Button>
          <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={(e) => {
            const file = e.target.files && e.target.files[0]; if (!file) return;
            const rd = new FileReader(); rd.onload = () => setText(String(rd.result)); rd.readAsText(file); e.target.value = '';
          }} />
        </div>
        <textarea value={text} onChange={(e) => { setText(e.target.value); setError(''); }} rows={12} spellCheck="false"
          placeholder='[ { "module": "pieges", "prompt": "...", "answer": "..." } ]'
          className="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 focus:border-indigo-400 font-mono text-xs leading-relaxed bg-slate-50" />
        <div className="text-xs font-medium h-4">
          {parsed === undefined && text.trim() && <span className="text-rose-600">JSON invalide pour l’instant…</span>}
          {rawList && <span className="text-emerald-600">{rawList.length} élément(s) détecté(s){isBackup ? ' · sauvegarde complète reconnue' : ''}</span>}
        </div>
        {error && <div className="text-sm text-rose-600 bg-rose-50 rounded-xl px-3 py-2">{error}</div>}
        <div className="flex flex-col sm:flex-row gap-2 justify-end">
          {isBackup && <Button variant="ghost" onClick={() => {
            if (!confirm('Restaurer cette sauvegarde ? Toutes tes cartes et ta progression actuelles seront remplacées.')) return;
            onRestore(parsed); onClose();
          }}><Icon name={['History']} size={16} /> Restaurer (remplace tout)</Button>}
          <Button onClick={merge} disabled={!text.trim()}><Icon name={['Upload']} size={16} /> Ajouter au deck</Button>
        </div>
      </div>
    </Modal>
  );
}

function DataView({ cards, stats, setStats, onAdd, onExport, onOpenImport, onResetProgress, onWipe, notify }) {
  const s = stats.settings;
  const setS = (k, v) => setStats((st) => ({ ...st, settings: { ...st.settings, [k]: v } }));
  const box = 'rounded-3xl bg-white border border-slate-200 p-5 sm:p-6';
  return (
    <div className="max-w-5xl mx-auto px-4 py-6 sm:py-8 grid lg:grid-cols-2 gap-5">
      <div className={box}>
        <h3 className="font-extrabold text-slate-900 mb-1 flex items-center gap-2"><Icon name={['SquarePlus', 'PlusSquare']} size={20} className="text-emerald-500" /> Ajout manuel</h3>
        <p className="text-sm text-slate-500 mb-4">Une erreur repérée en réunion ou une belle tournure lue ? Crée la carte tout de suite.</p>
        <AddCardForm onAdd={(c) => { onAdd(c); notify('Carte ajoutée — elle est due aujourd’hui.'); }} />
      </div>

      <div className="space-y-5">
        <div className={box}>
          <h3 className="font-extrabold text-slate-900 mb-1 flex items-center gap-2"><Icon name={['Database']} size={20} className="text-indigo-500" /> Import & sauvegarde</h3>
          <p className="text-sm text-slate-500 mb-4">Tout est stocké dans ce navigateur (LocalStorage). Exporte régulièrement une copie de secours : le fichier permet aussi de transférer ta progression sur un autre appareil.</p>
          <div className="grid sm:grid-cols-2 gap-3">
            <Button variant="indigo" onClick={onOpenImport}><Icon name={['Upload']} size={16} /> Importer du JSON</Button>
            <Button variant="dark" onClick={onExport}><Icon name={['Download']} size={16} /> Exporter ma progression</Button>
          </div>
          <div className="mt-3 text-xs text-slate-400">{cards.length} cartes · {stats.xp} XP · dernière étude : {stats.lastStudyDate ? fmtDate(stats.lastStudyDate) : '—'}</div>
        </div>

        <div className={box}>
          <h3 className="font-extrabold text-slate-900 mb-4 flex items-center gap-2"><Icon name={['Settings']} size={20} className="text-slate-500" /> Réglages</h3>
          <div className="space-y-4 text-sm">
            <div className="flex items-center justify-between gap-3">
              <span className="font-semibold text-slate-700">Accent de la voix</span>
              <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                {[['en-GB', '🇬🇧 UK'], ['en-US', '🇺🇸 US']].map(([v, l]) => (
                  <button key={v} onClick={() => setS('accent', v)} className={`px-3 py-1.5 rounded-lg font-semibold ${s.accent === v ? 'bg-white shadow text-slate-900' : 'text-slate-500'}`}>{l}</button>
                ))}
              </div>
            </div>
            <div className="flex items-center justify-between gap-3">
              <span className="font-semibold text-slate-700">Vitesse ({s.rate.toFixed(2)}×)</span>
              <div className="flex items-center gap-2">
                <input type="range" min="0.6" max="1.3" step="0.05" value={s.rate} onChange={(e) => setS('rate', Number(e.target.value))} className="accent-emerald-500" />
                <SpeakButton text="Never had I seen such a thorough analysis." settings={s} compact />
              </div>
            </div>
            <label className="flex items-center justify-between gap-3 cursor-pointer">
              <span className="font-semibold text-slate-700">Lecture audio automatique après réponse</span>
              <input type="checkbox" checked={s.autoplay} onChange={(e) => setS('autoplay', e.target.checked)} className="h-4 w-4 accent-emerald-500" />
            </label>
            <div className="flex items-center justify-between gap-3">
              <span className="font-semibold text-slate-700">Cartes max. par session du jour</span>
              <input type="number" min="5" max="500" value={s.sessionLimit} onChange={(e) => setS('sessionLimit', clamp(Number(e.target.value) || 40, 5, 500))} className="w-20 px-2 py-1.5 rounded-lg border border-slate-200 text-right" />
            </div>
            <div className="flex items-center justify-between gap-3">
              <span className="font-semibold text-slate-700">Objectif quotidien (révisions)</span>
              <input type="number" min="5" max="300" value={s.dailyGoal} onChange={(e) => setS('dailyGoal', clamp(Number(e.target.value) || 20, 5, 300))} className="w-20 px-2 py-1.5 rounded-lg border border-slate-200 text-right" />
            </div>
          </div>
        </div>

        <div className="rounded-3xl border border-rose-200 bg-rose-50/50 p-5 sm:p-6">
          <h3 className="font-extrabold text-rose-700 mb-3 flex items-center gap-2"><Icon name={['TriangleAlert', 'AlertTriangle']} size={20} /> Zone sensible</h3>
          <div className="flex flex-wrap gap-2">
            <Button size="sm" variant="ghost" onClick={() => { if (confirm('Remettre toutes les cartes au niveau 1 (dues aujourd’hui) ? Tes cartes sont conservées.')) onResetProgress(); }}>Réinitialiser la progression</Button>
            <Button size="sm" variant="danger" onClick={() => { if (confirm('Tout effacer et revenir aux cartes de départ ? Pense à exporter avant.')) onWipe(); }}>Tout effacer</Button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   APP
   ========================================================= */
function App() {
  const [cards, setCards] = useState(loadCards);
  const [stats, setStats] = useState(loadStats);
  const [view, setView] = useState('home');
  const [session, setSession] = useState(null);
  const [practice, setPractice] = useState(null);
  const [showImport, setShowImport] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  useEffect(() => { try { localStorage.setItem(STORAGE_CARDS, JSON.stringify(cards)); } catch (e) {} }, [cards]);
  useEffect(() => { try { localStorage.setItem(STORAGE_STATS, JSON.stringify(stats)); } catch (e) {} }, [stats]);
  useEffect(() => { if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } }, []);

  const notify = (msg, type = 'success') => {
    setToast({ msg, type }); clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3200);
  };

  const today = todayISO();
  const dueCount = cards.filter((c) => c.nextReviewDate <= today).length;
  const streak = stats.lastStudyDate === today || stats.lastStudyDate === addDays(today, -1) ? stats.streak : 0;

  const startSession = (ids, updateSRS, title) => {
    if (!ids.length) return notify('Aucune carte disponible.', 'info');
    setSession({ ids, updateSRS, title, nonce: Date.now() }); setView('session'); setPractice(null); window.scrollTo(0, 0);
  };
  const startDaily = () => {
    const due = shuffle(cards.filter((c) => c.nextReviewDate <= todayISO()))
      .sort((a, b) => a.nextReviewDate.localeCompare(b.nextReviewDate))
      .slice(0, stats.settings.sessionLimit);
    startSession(shuffle(due).map((c) => c.id), true, 'Session du jour');
  };
  const onAnswer = (id, correct, { updateSRS, firstAttempt }) => {
    if (updateSRS) setCards((prev) => prev.map((c) => (c.id === id ? applySRS(c, correct) : c)));
    setStats((prev) => recordStats(prev, correct, firstAttempt));
  };

  const exportData = () => {
    const data = { app: 'road-to-c1', version: 1, exportedAt: new Date().toISOString(), cards, stats };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `road-to-c1-sauvegarde-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    notify('Sauvegarde exportée.');
  };

  const navBtn = (v, label, icon) => (
    <button onClick={() => setView(v)} className={`inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold transition ${view === v ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
      <Icon name={icon} size={16} /><span className="hidden sm:inline">{label}</span>
    </button>
  );

  return (
    <div className="min-h-screen">
      {view !== 'session' && (
        <header className="sticky top-0 z-40 bg-white/85 backdrop-blur border-b border-slate-200">
          <div className="max-w-5xl mx-auto px-4 h-16 flex items-center gap-3">
            <button onClick={() => setView('home')} className="flex items-center gap-2 mr-auto">
              <span className="h-9 w-9 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 text-white flex items-center justify-center font-black shadow-sm">C1</span>
              <span className="font-extrabold text-slate-900 hidden xs:inline sm:inline">Road to C1</span>
            </button>
            <nav className="flex items-center gap-1">
              {navBtn('home', 'Accueil', ['House', 'Home'])}
              {navBtn('library', 'Bibliothèque', ['BookOpen'])}
              {navBtn('data', 'Données', ['Database'])}
            </nav>
            <div className="hidden md:flex items-center gap-3 pl-3 ml-1 border-l border-slate-200">
              <span className="flex items-center gap-1 text-sm font-bold text-orange-500"><Icon name={['Flame']} size={18} />{streak}</span>
              <span className="flex items-center gap-1 text-sm font-bold text-rose-500"><Icon name={['CalendarCheck', 'Calendar']} size={18} />{dueCount}</span>
            </div>
          </div>
        </header>
      )}

      <main>
        {view === 'home' && <Home cards={cards} stats={stats} onStartDaily={startDaily} onPractice={(m) => setPractice(m)} onImport={() => setShowImport(true)} />}
        {view === 'library' && <Library cards={cards} settings={stats.settings}
          onDelete={(id) => { setCards((p) => p.filter((c) => c.id !== id)); notify('Carte supprimée.', 'info'); }}
          onReset={(id) => { setCards((p) => p.map((c) => (c.id === id ? { ...c, level: 1, nextReviewDate: todayISO() } : c))); notify('Carte remise au niveau 1.', 'info'); }} />}
        {view === 'data' && <DataView cards={cards} stats={stats} setStats={setStats} notify={notify}
          onAdd={(c) => setCards((p) => [c, ...p])} onExport={exportData} onOpenImport={() => setShowImport(true)}
          onResetProgress={() => { setCards((p) => p.map((c) => ({ ...c, level: 1, nextReviewDate: todayISO(), reviews: 0, lapses: 0, correctCount: 0, lastReviewed: null }))); notify('Progression réinitialisée.', 'info'); }}
          onWipe={() => { setCards(SEED.map(makeCard)); setStats(DEFAULT_STATS); notify('Application réinitialisée.', 'info'); }} />}
        {view === 'session' && session && (
          <Session key={session.nonce} session={session} cards={cards} settings={stats.settings} onAnswer={onAnswer}
            onExit={() => { if ('speechSynthesis' in window) speechSynthesis.cancel(); setView('home'); setSession(null); }}
            onMore={() => {
              const list = shuffle(cards).sort((a, b) => (a.reviews ? a.level : 0.5) - (b.reviews ? b.level : 0.5)).slice(0, 10);
              startSession(shuffle(list).map((c) => c.id), false, 'Entraînement libre');
            }} />
        )}
      </main>

      {view !== 'session' && (
        <footer className="max-w-5xl mx-auto px-4 pb-10 pt-2 text-center text-xs text-slate-400">
          Répétition espacée : niveau 1 → 1 j · 2 → 3 j · 3 → 7 j · 4 → 16 j · 5 → 30 j. Une erreur renvoie au niveau 1.
        </footer>
      )}

      {practice && <PracticeModal initialModule={practice} cards={cards} onClose={() => setPractice(null)} onStart={(ids, srs) => startSession(ids, srs, 'Entraînement libre')} />}
      {showImport && <ImportModal cards={cards} notify={notify} onClose={() => setShowImport(false)}
        onMerge={(added) => setCards((p) => [...p, ...added])}
        onRestore={(data) => {
          const restored = data.cards.map(makeCard).filter(Boolean);
          setCards(restored);
          if (data.stats) setStats({ ...DEFAULT_STATS, ...data.stats, settings: { ...DEFAULT_STATS.settings, ...(data.stats.settings || {}) }, history: data.stats.history || {} });
          notify(`Sauvegarde restaurée : ${restored.length} cartes.`);
        }} />}
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
